name: SprintSpace CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend JavaScript check and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        working-directory: backend
        run: npm install
      - name: Unit tests
        working-directory: backend
        run: npm test
      - name: Build
        working-directory: backend
        run: npm run build

  frontend:
    name: Frontend production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        working-directory: frontend
        run: npm install
      - name: Production build
        working-directory: frontend
        run: npm run build

  end-to-end:
    name: API and browser end-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      PORT: 5001
      CLIENT_URL: http://127.0.0.1:5173
      MONGODB_URI: mongodb://127.0.0.1:27017/sprintspace_e2e
      REDIS_URL: redis://127.0.0.1:6379
      JWT_ACCESS_SECRET: test-access-secret-012345678901234567890
      JWT_REFRESH_SECRET: test-refresh-secret-012345678901234567890
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install backend dependencies
        working-directory: backend
        run: npm install
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install
      - name: API end-to-end lifecycle tests
        working-directory: backend
        run: npm run test:integration
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Browser end-to-end journey
        working-directory: frontend
        run: npm run test:e2e

  containers:
    name: Docker Compose validation and image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build API image
        run: docker build -t sprintspace-api:ci ./backend
      - name: Build frontend image
        run: docker build --build-arg VITE_API_URL=/api/v1 --build-arg VITE_SOCKET_URL= -t sprintspace-web:ci ./frontend
