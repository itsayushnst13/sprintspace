name: SprintSpace CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend typecheck, tests, and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        working-directory: backend
        run: npm install
      - name: Typecheck
        working-directory: backend
        run: npm run typecheck
      - name: Tests
        working-directory: backend
        run: npm test
      - name: Build
        working-directory: backend
        run: npm run build

  frontend:
    name: Frontend typecheck and production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        working-directory: frontend
        run: npm install
      - name: Typecheck and build
        working-directory: frontend
        run: npm run build

  containers:
    name: Docker Compose validation and image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build API image
        run: docker build -t sprintspace-api:ci ./backend
      - name: Build frontend image
        run: docker build --build-arg VITE_API_URL=/api/v1 --build-arg VITE_SOCKET_URL= -t sprintspace-web:ci ./frontend
